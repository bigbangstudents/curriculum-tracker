<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curriculum Operations & Production Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- PDF.js for Exact Page-by-Page PDF Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
  <style>
    :root {
      --bg-base: #090d16;
      --bg-surface: #0f1624;
      --bg-surface-elevated: #162033;
      --border: #1e2c45;
      --border-focus: #3b82f6;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --c-l1: #10b981;
      --c-l2: #0ea5e9;
      --c-l3: #8b5cf6;
      --c-l4: #f59e0b;
      --c-l5: #f43f5e;

      --st-none-bg: #1e293b;
      --st-none-text: #94a3b8;
      --st-none-border: #334155;

      --st-draft-bg: rgba(245, 158, 11, 0.15);
      --st-draft-text: #fbbf24;
      --st-draft-border: rgba(245, 158, 11, 0.4);

      --st-review-bg: rgba(139, 92, 246, 0.18);
      --st-review-text: #c084fc;
      --st-review-border: rgba(139, 92, 246, 0.45);

      --st-ready-bg: rgba(16, 185, 129, 0.18);
      --st-ready-text: #34d399;
      --st-ready-border: rgba(16, 185, 129, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .top-nav {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-logo {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }

    .cloud-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .cloud-pill.syncing {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.3);
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
    .syncing .pulse-dot {
      background: #fbbf24;
      box-shadow: 0 0 6px #fbbf24;
    }

    .control-cluster {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .track-toggle {
      display: inline-flex;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 3px;
      flex-wrap: wrap;
    }
    .track-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .track-btn.active {
      background: #2563eb;
      color: #ffffff;
    }
    .track-btn.active.makeup {
      background: #8b5cf6;
      color: #ffffff;
    }
    .track-btn.active.festive {
      background: #ec4899;
      color: #ffffff;
    }

    select, input[type="text"], input[type="date"] {
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      transition: border 0.15s;
    }
    select:focus, input:focus { border-color: var(--border-focus); }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px 28px;
    }

    .level-tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      overflow-x: auto;
    }
    .tab-btn {
      background: transparent;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text-main); }
    .tab-btn.active-l1 { color: var(--c-l1); border-color: var(--c-l1); }
    .tab-btn.active-l2 { color: var(--c-l2); border-color: var(--c-l2); }
    .tab-btn.active-l3 { color: var(--c-l3); border-color: var(--c-l3); }
    .tab-btn.active-l4 { color: var(--c-l4); border-color: var(--c-l4); }
    .tab-btn.active-l5 { color: var(--c-l5); border-color: var(--c-l5); }
    .tab-btn.active-matrix { color: #38bdf8; border-color: #38bdf8; }

    .level-banner {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 22px;
      margin-bottom: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .level-banner-title {
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .teacher-input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .teacher-input-wrap label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .btn-signoff-all {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      font-weight: 700;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-signoff-all:hover {
      background: #10b981;
      color: #090d16;
    }

    .tracker-table-wrap {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 1040px;
    }
    th {
      background: var(--bg-surface-elevated);
      color: var(--text-dim);
      font-size: 11.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }

    .deliverable-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }
    .deliverable-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .chips-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .topic-chip {
      background: var(--st-none-bg);
      color: var(--st-none-text);
      border: 1px solid var(--st-none-border);
      border-radius: 8px;
      padding: 6px 12px;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      min-width: 54px;
      transition: background 0.1s, border-color 0.1s;
      user-select: none;
    }
    .topic-chip .chip-name {
      font-size: 12px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      display: block;
    }
    .topic-chip .chip-state {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .topic-chip.state-none { background: var(--st-none-bg); color: var(--st-none-text); border-color: var(--st-none-border); }
    .topic-chip.state-draft { background: var(--st-draft-bg); color: var(--st-draft-text); border-color: var(--st-draft-border); }
    .topic-chip.state-review { background: var(--st-review-bg); color: var(--st-review-text); border-color: var(--st-review-border); }
    .topic-chip.state-ready { background: var(--st-ready-bg); color: var(--st-ready-text); border-color: var(--st-ready-border); }

    .btn-quick-signoff {
      background: var(--bg-surface-elevated);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      cursor: pointer;
      margin-left: 8px;
      transition: all 0.15s;
    }
    .btn-quick-signoff:hover {
      background: var(--st-ready-bg);
      color: var(--st-ready-text);
      border-color: var(--st-ready-border);
    }

    .deadline-cell {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .badge-countdown {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
    }
    .countdown-green { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .countdown-amber { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .countdown-red { background: rgba(244, 63, 94, 0.18); color: #fb7185; }

    /* Multi-Link & Spellcheck QA Styling */
    .links-cell-container {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .links-pills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .btn-link-pill {
      background: #1e3a8a;
      color: #93c5fd;
      border: 1px solid #2563eb;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11.5px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-link-pill:hover {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-link-pill.pill-qa-ok {
      border-color: rgba(16, 185, 129, 0.6);
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
    }
    .btn-link-pill.pill-qa-err {
      border-color: rgba(244, 63, 94, 0.65);
      background: rgba(244, 63, 94, 0.18);
      color: #fda4af;
    }

    .btn-open-linkmodal {
      background: var(--bg-surface-elevated);
      color: var(--text-muted);
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      width: fit-content;
      transition: all 0.15s;
    }
    .btn-open-linkmodal:hover {
      border-color: #38bdf8;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
    }

    .btn-scan-qa {
      background: rgba(59, 130, 246, 0.16);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.45);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      font-family: inherit;
    }
    .btn-scan-qa:hover:not(:disabled) {
      background: #2563eb;
      color: #ffffff;
      border-color: #3b82f6;
    }
    .btn-scan-qa:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .qa-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      font-family: inherit;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .qa-badge.qa-passed {
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.4);
    }
    .qa-badge.qa-typos {
      background: rgba(244, 63, 94, 0.18);
      color: #fb7185;
      border-color: rgba(244, 63, 94, 0.5);
    }
    .qa-badge.qa-typos:hover {
      background: rgba(244, 63, 94, 0.3);
      color: #fff;
    }
    .qa-badge.qa-error {
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.45);
    }
    .qa-badge.qa-unscanned {
      background: rgba(100, 116, 139, 0.14);
      color: var(--text-dim);
      border-color: var(--border);
      cursor: default;
    }

    .timestamp-text {
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 4px;
    }

    /* Festive Theme Cards */
    .festive-theme-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-left: 4px solid #ec4899;
      border-radius: 12px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .festive-theme-header {
      padding: 16px 22px;
      background: rgba(236, 72, 153, 0.06);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .theme-title-input {
      font-size: 17px;
      font-weight: 800;
      color: #f472b6;
      background: transparent;
      border: 1px solid transparent;
      padding: 4px 8px;
      border-radius: 6px;
      outline: none;
      width: 290px;
      transition: border 0.15s;
    }
    .theme-title-input:focus {
      background: var(--bg-surface-elevated);
      border-color: #ec4899;
    }
    .btn-add-theme {
      background: rgba(236, 72, 153, 0.12);
      color: #f472b6;
      border: 1.5px dashed rgba(236, 72, 153, 0.45);
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      transition: all 0.15s;
    }
    .btn-add-theme:hover {
      background: rgba(236, 72, 153, 0.22);
      border-color: #ec4899;
      color: #fff;
    }

    .reset-float-btn {
      position: fixed;
      bottom: 24px;
      right: 28px;
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.35);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      z-index: 50;
    }
    .reset-float-btn:hover { background: #f43f5e; color: #fff; }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      display: none;
      place-items: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-overlay.modal-top {
      z-index: 130;
    }
    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      max-width: 640px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .typo-item-card {
      background: var(--bg-surface-elevated);
      border: 1px solid rgba(244, 63, 94, 0.35);
      border-left: 4px solid #f43f5e;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .typo-loc-badge {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 2px 8px;
      border-radius: 5px;
      margin-bottom: 6px;
    }
    .typo-diff-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .typo-word-bad {
      color: #fb7185;
      font-weight: 800;
      font-size: 15px;
      text-decoration: line-through;
    }
    .typo-word-good {
      color: #34d399;
      font-weight: 700;
      font-size: 13.5px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: 6px;
    }
    .typo-context {
      color: var(--text-muted);
      font-size: 12.5px;
      font-style: italic;
      word-break: break-word;
    }

    .modal-link-row {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .modal-link-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .modal-link-controls input {
      flex: 1;
      background: var(--bg-surface);
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <div class="brand-title">
      <div class="brand-logo">CO</div>
      <span>Curriculum Ops Tracker</span>
      <div id="cloudStatus" class="cloud-pill">
        <span class="pulse-dot"></span> Connecting...
      </div>
    </div>

    <div class="control-cluster">
      <div class="track-toggle">
        <button id="trackCore" class="track-btn active" onclick="setTrack('core')">Core Curriculum</button>
        <button id="trackPres" class="track-btn" onclick="setTrack('presentation')">Presentation Track</button>
        <button id="trackMakeup" class="track-btn" onclick="setTrack('makeup')">Make-Up Classes</button>
        <button id="trackFestive" class="track-btn" onclick="setTrack('festive')">Festive Camps</button>
      </div>

      <select id="termSelect" onchange="changeTerm()"></select>
      <select id="topicBlockSelect" onchange="changeBlock()"></select>
    </div>
  </nav>

  <div class="container">
    <div class="level-tabs" id="tabBar">
      <button class="tab-btn active-l1" onclick="setLevel(1)">Level 1</button>
      <button class="tab-btn" onclick="setLevel(2)">Level 2</button>
      <button class="tab-btn" onclick="setLevel(3)">Level 3</button>
      <button class="tab-btn" onclick="setLevel(4)">Level 4</button>
      <button class="tab-btn" onclick="setLevel(5)">Level 5</button>
      <button class="tab-btn" onclick="setLevel('matrix')">Ops All-Levels Matrix</button>
    </div>

    <div id="appRoot"></div>
  </div>

  <button class="reset-float-btn" onclick="openResetModal()">Reset Section State</button>

  <!-- Granular Multi-Links & Per-Link Spellcheck Modal -->
  <div id="linksModal" class="modal-overlay">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h3 id="linksModalTitle" style="font-size: 18px; font-weight:800; color:var(--text-main);">Manage Deliverable Links</h3>
        <button onclick="closeLinksModal()" style="background:transparent; border:none; color:var(--text-muted); font-size:18px; cursor:pointer;">✕</button>
      </div>
      <p id="linksModalSubtitle" style="color: var(--text-muted); font-size: 13px; margin-bottom: 16px;"></p>

      <div id="linksModalInputs" style="display:flex; flex-direction:column; gap:10px;"></div>

      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-top:20px;">
        <button id="scanAllModalBtn" class="btn-scan-qa" onclick="scanAllModalLinks()">🔍 Scan All Links</button>
        <div style="display:flex; gap:10px;">
          <button onclick="closeLinksModal()" style="background:transparent; border:1px solid var(--border); color:#fff; padding:8px 16px; border-radius:6px; cursor:pointer;">Cancel</button>
          <button onclick="saveLinksModal()" style="background:#2563eb; border:none; color:#fff; padding:8px 18px; border-radius:6px; font-weight:700; cursor:pointer;">Save Links</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Spellcheck Typo Inspector Modal -->
  <div id="typoModal" class="modal-overlay modal-top">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px;">
        <div>
          <h3 id="typoModalTitle" style="font-size: 18px; font-weight:800; color:var(--text-main);">Spellcheck Report (British English)</h3>
          <p id="typoModalSub" style="color: var(--text-muted); font-size: 12px; margin-top:3px; font-family:'JetBrains Mono', monospace;"></p>
        </div>
        <button onclick="closeTypoModal()" style="background:transparent; border:none; color:var(--text-muted); font-size:18px; cursor:pointer;">✕</button>
      </div>

      <div id="typoModalBody" style="display:flex; flex-direction:column; gap:10px; max-height:55vh; overflow-y:auto; padding-right:4px;"></div>

      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:20px; padding-top:14px; border-top:1px solid var(--border);">
        <button id="typoRescanBtn" class="btn-scan-qa" onclick="rescanActiveTypoTarget()">🔄 Re-Scan File</button>
        <button onclick="closeTypoModal()" style="background:#2563eb; border:none; color:#fff; padding:8px 18px; border-radius:6px; font-weight:700; cursor:pointer;">Done</button>
      </div>
